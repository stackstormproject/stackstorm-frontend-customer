<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="t">
  <title id="t">A woven diamond pattern in the shop's colours</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <pattern id="lattice" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="90" height="90" fill="none" />
      <rect x="4" y="4" width="82" height="82" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="45" cy="45" r="3" fill="#d4af37" fill-opacity="0.5" />
    </pattern>
  </defs>
  <rect width="720" height="900" fill="url(#bg)" />
  <rect width="720" height="900" fill="url(#lattice)" />
  <rect x="0" y="0" width="720" height="900" fill="none" stroke="#d4af37" stroke-opacity="0.5" stroke-width="10" />
</svg>
