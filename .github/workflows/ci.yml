name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  frontend-ci:
    uses: stackstormproject/infra/.github/workflows/frontend-ci.yml@v1
    secrets: inherit
