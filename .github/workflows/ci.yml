name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'chore/**'
      - 'test/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-ci:
    uses: stackstormproject/infra/.github/workflows/frontend-ci.yml@main
    secrets: inherit
