# Included in every block that sets its own add_header: nginx drops server-level
# add_header directives in any location that defines one.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Payment happens on Stripe's own hosted page (a navigation), so no Stripe script is loaded
# here (#182). Seed product images come from images.unsplash.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
